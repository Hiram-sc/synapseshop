  /api/v1/items/:
    get:
      operationId: v1_items_list
      description: 'A resposta traz o header `X-Cache` com `HIT`, `MISS` ou `BYPASS`.
        Filtros: `?search=`, `?is_active=`, `?category=`; ordenação por `?ordering=`.'
      summary: Lista itens (paginado, cache-aside)
      parameters:
      - in: query
        name: category
        schema:
          type: integer
        description: Filtra os itens da categoria com este id.
      - in: query
        name: is_active
        schema:
          type: boolean
        description: Filtra por `is_active` (`true`/`false`).
      - name: limit
        required: false
        in: query
        description: Número de resultados a serem retornados por página.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Qual campo usar ao ordenar os resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Um termo de busca.
        schema:
          type: string
      tags:
      - items
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedItemList'
          description: ''
        '429':
          description: Limite de requisições excedido. Consulte o header Retry-After.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: v1_items_create
      description: 'CRUD de itens do catálogo, com cache-aside nas leituras.


        Mesmas regras de `CategoryViewSet`, somando os filtros `?is_active=` e

        `?category=` - eles são os que sustentam os índices compostos de

        `repositories.models.Item`.


        As duas leituras (`list` e `retrieve`) são cache-aside: o cache do Redis é

        consultado primeiro e, quando não há nada, o PostgreSQL responde e o

        resultado é gravado. A resposta sempre traz `X-Cache: HIT|MISS|BYPASS`, e

        toda escrita publica um evento que invalida o que ficou velho.'
      summary: Cria item (admin)
      tags:
      - items
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ItemRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ItemRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
          description: ''
