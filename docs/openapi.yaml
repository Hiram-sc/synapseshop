openapi: 3.0.3
info:
  title: SynapseShop API
  version: 1.0.0
  description: 'API de catalogo e pedidos do SynapseShop (Django REST Framework).


    ## Convencoes

    - Base: `/api/v1/`.

    - Autenticacao: `Authorization: Bearer <token>` (JWT), emitido por `POST /api/v1/auth/login/`.

    - Paginacao: `?page=<n>&limit=<1..100>` (envelope `count`, `next`, `previous`,
    `results`).

    - Filtros: `?search=`, `?is_active=`, `?category=` (itens) e `?search=` (categorias).

    - Ordenacao: `?ordering=campo` e `?ordering=-campo`.

    - Idempotencia do pedido: campo `idempotency_key` no corpo do `POST /api/v1/pedidos/`
    (nao um header).


    ## Divergencias em relacao a convencoes propostas

    `nextCursor`, `?status=` e `sort=campo:ordem` nao sao suportados; `X-Trace-Id`
    nao e aplicado. Ver `docs/`.'
  contact:
    name: Equipe SynapseShop
    email: api@synapseshop.dev
  license:
    name: Propriedade do curso (uso acadêmico) - sem licença pública.
paths:
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      description: 'Autentica credenciais e devolve um token JWT de acesso.


        Rota pública por definição - é a porta de entrada - e com o limite mais

        apertado da API (5 tentativas por minuto, por IP), porque é a única rota

        que recebe credenciais de fora sem token.


        Falhas de credencial respondem 401 com mensagem genérica, sem distinguir

        "usuário inexistente" de "senha errada" - assim o login não serve para

        enumerar quais contas existem. Conta desativada responde 403, mas só depois

        que a senha conferiu: quem recebe 403 já provou conhecer a senha, então a

        resposta não vira oráculo de enumeração.'
      summary: Autentica credenciais e emite um token JWT
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: 'Corpo inválido: `username` e/ou `password` ausentes.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Usuário ou senha inválidos.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Conta desativada.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Limite de tentativas de login excedido (5/min por IP).
  /api/v1/auth/me/:
    get:
      operationId: v1_auth_me_retrieve
      description: 'Devolve o usuário do token enviado na requisição.


        Existe para o cliente (e para os testes) confirmar quem está autenticado

        e qual role o token carrega, sem precisar decodificá-lo à mão.'
      summary: Usuário do token enviado
      tags:
      - auth
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '401':
          description: Autenticação ausente ou token inválido/expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Autenticado, mas sem permissão para a operação.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Limite de requisições excedido. Consulte o header Retry-After.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/categories/:
    get:
      operationId: v1_categories_list
      description: 'CRUD de categorias.


        Leitura (`GET`) é pública; escrita exige `role admin` e o limite de

        escrita (30/min por usuário). `?search=` e `?ordering=` funcionam nas

        duas direções da operação, com a mesma paginação dos itens.


        A listagem de categorias **não** é cacheada (o volume é pequeno e a

        invalidação não custaria caro), mas toda escrita aqui invalida o cache de

        `Item`: o `category_name` aparece no detalhe de cada item e a categoria

        também é filtro da listagem de itens.'
      summary: Lista categorias (paginado)
      parameters:
      - name: limit
        required: false
        in: query
        description: Número de resultados a serem retornados por página.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Qual campo usar ao ordenar os resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Um termo de busca.
        schema:
          type: string
      tags:
      - categories
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCategoryList'
          description: ''
        '429':
          description: Limite de requisições excedido. Consulte o header Retry-After.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
