[pytest]
# Configuração central da suíte de testes (Aula 12).
#
# As settings são as mesmas da aplicação: os testes rodam contra o PostgreSQL
# e o Redis do Compose, em um banco de teste (`test_<POSTGRES_DB>`) e em um
# Redis isolado (`REDIS_DB` sobrescrito via `docker compose exec -e`).
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
testpaths = tests

markers =
    unit: teste unitário puro, sem banco de dados nem broker
    integration: teste de integração (banco de dados e/ou API HTTP)

# A cobertura é sempre medida pelo pytest; o escopo/omit vive no `.coveragerc`.
# `--cov` sem valor usa o `source` declarado naquele arquivo.
addopts =
    -ra
    --cov
    --cov-config=.coveragerc
    --cov-report=term-missing
