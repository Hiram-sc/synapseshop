services:

  api:
    build: .
    image: synapseshop:dev
    container_name: synapseshop-api
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: synapseshop
      POSTGRES_USER: synapseshop
      POSTGRES_PASSWORD: synapseshop
      # Aula 7 - assinatura e expiração do JWT, e limites de requisição.
      # Os valores abaixo são apenas para desenvolvimento; em produção a
      # chave sai do secret manager, nunca de um arquivo versionado.
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-dev-only-jwt-key-troque-em-producao}
      JWT_ACCESS_TOKEN_LIFETIME_MINUTES: ${JWT_ACCESS_TOKEN_LIFETIME_MINUTES:-30}
      THROTTLE_ANON_RATE: ${THROTTLE_ANON_RATE:-60/min}
      THROTTLE_USER_RATE: ${THROTTLE_USER_RATE:-300/min}
      THROTTLE_LOGIN_RATE: ${THROTTLE_LOGIN_RATE:-5/min}
      THROTTLE_ADMIN_WRITE_RATE: ${THROTTLE_ADMIN_WRITE_RATE:-30/min}
      # Aula 8 - cache-aside com Redis. O host é o nome do serviço na rede do
      # Compose. O cache nunca é obrigatório para a API responder: se o Redis
      # cair, a API continua servindo do PostgreSQL (fail-open).
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: ${REDIS_DB:-0}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_TTL_LISTA: ${CACHE_TTL_LISTA:-60}
      CACHE_TTL_DETALHE: ${CACHE_TTL_DETALHE:-300}
      # Aula 11 - TTL do cache-aside do pedido (GET /pedidos/{id}/)
      CACHE_TTL_PEDIDO: ${CACHE_TTL_PEDIDO:-60}
      # Aula 9 - broker da mensageria. A API é o produtor (publica depois do
      # commit); o worker consome. As credenciais abaixo são as de
      # desenvolvimento, as mesmas do serviço rabbitmq.
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER:-synapseshop}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-synapseshop}
      PEDIDO_IDEMPOTENCIA_TTL_S: ${PEDIDO_IDEMPOTENCIA_TTL_S:-3600}
      # Aula 10 - seleção de broker e Kafka (padrão). `MENSAGERIA_BROKER=kafka`
      # usa o Apache Kafka; `=rabbitmq` reativa o fluxo da Aula 9, preservado.
      MENSAGERIA_BROKER: ${MENSAGERIA_BROKER:-kafka}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-synapseshop-worker}
      KAFKA_TOPIC_PEDIDO_CRIADO: ${KAFKA_TOPIC_PEDIDO_CRIADO:-pedidos.pedidocriado}
      KAFKA_TOPIC_DLQ: ${KAFKA_TOPIC_DLQ:-pedidos.pedidocriado.dlq}
      # Topologia (aplicada na criacao dos topicos) e produtor da API: sem
      # estas entradas o .env seria silenciosamente ignorado no container.
      KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-3}
      KAFKA_DLQ_PARTITIONS: ${KAFKA_DLQ_PARTITIONS:-1}
      KAFKA_RETENTION_MS_MAIN: ${KAFKA_RETENTION_MS_MAIN:-604800000}
      KAFKA_RETENTION_MS_DLQ: ${KAFKA_RETENTION_MS_DLQ:-2419200000}
      KAFKA_ENABLE_AUTO_COMMIT: ${KAFKA_ENABLE_AUTO_COMMIT:-false}
      KAFKA_AUTO_OFFSET_RESET: ${KAFKA_AUTO_OFFSET_RESET:-earliest}
      KAFKA_ACKS: ${KAFKA_ACKS:-all}
      KAFKA_RETRIES: ${KAFKA_RETRIES:-3}
      KAFKA_LINGER_MS: ${KAFKA_LINGER_MS:-10}
      # Aula 11 - tópicos do fluxo Pedido -> Pagamento -> Notificação.
      KAFKA_TOPIC_PAGAMENTO_PROCESSADO: ${KAFKA_TOPIC_PAGAMENTO_PROCESSADO:-pedidos.pagamentoprocessado}
      KAFKA_TOPIC_PAGAMENTO_DLQ: ${KAFKA_TOPIC_PAGAMENTO_DLQ:-pedidos.pagamentoprocessado.dlq}
      KAFKA_TOPIC_NOTIFICACAO_ENVIADA: ${KAFKA_TOPIC_NOTIFICACAO_ENVIADA:-pedidos.notificacaoenviada}
      KAFKA_TOPIC_NOTIFICACAO_DLQ: ${KAFKA_TOPIC_NOTIFICACAO_DLQ:-pedidos.notificacaoenviada.dlq}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # Aula 9 - broker RabbitMQ. Management na 15672 para inspeção de filas e
  # DLQ; o healthcheck atrasa o boot da API e do worker até o AMQP aceitar
  # conexões, em vez de deixar cada um tentando reconectar.
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: synapseshop-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-synapseshop}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-synapseshop}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # Aula 10 - broker padrão: Apache Kafka em KRaft (um nó broker+controller,
  # sem ZooKeeper). O listener PLAINTEXT (9092) é interno à rede do Compose;
  # o PLAINTEXT_HOST (29092) fica para ferramentas do host (Kafka UI, etc.).
  # Os tópicos são criação explícita da aplicação (`topologia_kafka.py`), por
  # isso auto-create está desligado: a topologia (partições/retenção) é
  # declarada, nunca implícita.
  kafka:
    image: apache/kafka:3.9.1
    container_name: synapseshop-kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      CLUSTER_ID: "synapseshop-kraft-cluster"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # Aula 9 - consumidor do evento PedidoCriado. Mesma imagem da API, outro
  # command: o worker precisa do Django/ORM para idempotência e estado do
  # pedido, mas não serve HTTP.
  pedido-worker:
    build: .
    image: synapseshop:dev
    container_name: synapseshop-pedido-worker
    command: python manage.py pedido_worker
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: synapseshop
      POSTGRES_USER: synapseshop
      POSTGRES_PASSWORD: synapseshop
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: ${REDIS_DB:-0}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER:-synapseshop}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-synapseshop}
      PEDIDO_IDEMPOTENCIA_TTL_S: ${PEDIDO_IDEMPOTENCIA_TTL_S:-3600}
      PEDIDO_WORKER_MAX_TENTATIVAS: ${PEDIDO_WORKER_MAX_TENTATIVAS:-4}
      PEDIDO_WORKER_BACKOFF_BASE_S: ${PEDIDO_WORKER_BACKOFF_BASE_S:-0.25}
      # Falha proposital para validação da DLQ (fnmatch, separado por
      # vírgula). VAZIO por padrão: a falha forçada nunca fica ligada.
      PEDIDO_WORKER_FALHA_IDEM_KEYS: ${PEDIDO_WORKER_FALHA_IDEM_KEYS:-}
      PEDIDO_WORKER_ESPERA_RECONEXAO_S: ${PEDIDO_WORKER_ESPERA_RECONEXAO_S:-5}
      # Aula 10 - mesmo broker da API (padrão kafka; rabbitmq para reativar a
      # Aula 9). O group.id é o que reparte as partições entre workers: várias
      # réplicas deste serviço escalam o consumo do tópico.
      MENSAGERIA_BROKER: ${MENSAGERIA_BROKER:-kafka}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-synapseshop-worker}
      KAFKA_TOPIC_PEDIDO_CRIADO: ${KAFKA_TOPIC_PEDIDO_CRIADO:-pedidos.pedidocriado}
      KAFKA_TOPIC_DLQ: ${KAFKA_TOPIC_DLQ:-pedidos.pedidocriado.dlq}
      # Consumer (commit/offset) e produtor de reentrega/DLQ do worker: sem
      # estas entradas o .env seria silenciosamente ignorado no container.
      KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-3}
      KAFKA_DLQ_PARTITIONS: ${KAFKA_DLQ_PARTITIONS:-1}
      KAFKA_RETENTION_MS_MAIN: ${KAFKA_RETENTION_MS_MAIN:-604800000}
      KAFKA_RETENTION_MS_DLQ: ${KAFKA_RETENTION_MS_DLQ:-2419200000}
      KAFKA_ENABLE_AUTO_COMMIT: ${KAFKA_ENABLE_AUTO_COMMIT:-false}
      KAFKA_AUTO_OFFSET_RESET: ${KAFKA_AUTO_OFFSET_RESET:-earliest}
      KAFKA_ACKS: ${KAFKA_ACKS:-all}
      KAFKA_RETRIES: ${KAFKA_RETRIES:-3}
      KAFKA_LINGER_MS: ${KAFKA_LINGER_MS:-10}
      # Aula 11 - o worker também cria a topologia dos eventos da Aula 11
      # (mesmos nomes da API); o consumo deles é do notificacao-worker.
      KAFKA_TOPIC_PAGAMENTO_PROCESSADO: ${KAFKA_TOPIC_PAGAMENTO_PROCESSADO:-pedidos.pagamentoprocessado}
      KAFKA_TOPIC_PAGAMENTO_DLQ: ${KAFKA_TOPIC_PAGAMENTO_DLQ:-pedidos.pagamentoprocessado.dlq}
      KAFKA_TOPIC_NOTIFICACAO_ENVIADA: ${KAFKA_TOPIC_NOTIFICACAO_ENVIADA:-pedidos.notificacaoenviada}
      KAFKA_TOPIC_NOTIFICACAO_DLQ: ${KAFKA_TOPIC_NOTIFICACAO_DLQ:-pedidos.notificacaoenviada.dlq}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # Aula 11 - consumidor do PagamentoProcessado: registra a notificação e
  # publica o evento terminal NotificacaoEnviada, fechando o fluxo
  # Pedido -> Pagamento -> Notificação. Mesma imagem da API, outro command;
  # group próprio, para o histórico de offset não misturar com o do
  # pedido-worker. Só existe no Kafka (padrão): com MENSAGERIA_BROKER=rabbitmq
  # o comando recusa iniciar, pois os eventos da Aula 11 não têm rota lá.
  notificacao-worker:
    build: .
    image: synapseshop:dev
    container_name: synapseshop-notificacao-worker
    command: python manage.py notificacao_worker
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: synapseshop
      POSTGRES_USER: synapseshop
      POSTGRES_PASSWORD: synapseshop
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: ${REDIS_DB:-0}
      PEDIDO_IDEMPOTENCIA_TTL_S: ${PEDIDO_IDEMPOTENCIA_TTL_S:-3600}
      PEDIDO_WORKER_MAX_TENTATIVAS: ${PEDIDO_WORKER_MAX_TENTATIVAS:-4}
      PEDIDO_WORKER_BACKOFF_BASE_S: ${PEDIDO_WORKER_BACKOFF_BASE_S:-0.25}
      # Mesma falha proposital do pedido-worker (fnmatch) para observar
      # retry -> DLQ também no consumo de pagamento. VAZIO por padrão.
      PEDIDO_WORKER_FALHA_IDEM_KEYS: ${PEDIDO_WORKER_FALHA_IDEM_KEYS:-}
      # Aula 11 - consumo do PagamentoProcessado: tópicos do fluxo e group
      # próprio (KAFKA_GROUP_ID_NOTIFICACAO) no lugar do group do pedido.
      MENSAGERIA_BROKER: ${MENSAGERIA_BROKER:-kafka}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_GROUP_ID_NOTIFICACAO: ${KAFKA_GROUP_ID_NOTIFICACAO:-synapseshop-notificacao-worker}
      KAFKA_TOPIC_PAGAMENTO_PROCESSADO: ${KAFKA_TOPIC_PAGAMENTO_PROCESSADO:-pedidos.pagamentoprocessado}
      KAFKA_TOPIC_PAGAMENTO_DLQ: ${KAFKA_TOPIC_PAGAMENTO_DLQ:-pedidos.pagamentoprocessado.dlq}
      KAFKA_TOPIC_NOTIFICACAO_ENVIADA: ${KAFKA_TOPIC_NOTIFICACAO_ENVIADA:-pedidos.notificacaoenviada}
      KAFKA_TOPIC_NOTIFICACAO_DLQ: ${KAFKA_TOPIC_NOTIFICACAO_DLQ:-pedidos.notificacaoenviada.dlq}
      # Consumer (commit/offset) e produtor (NotificacaoEnviada): sem estas
      # entradas o .env seria silenciosamente ignorado no container.
      KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-3}
      KAFKA_DLQ_PARTITIONS: ${KAFKA_DLQ_PARTITIONS:-1}
      KAFKA_RETENTION_MS_MAIN: ${KAFKA_RETENTION_MS_MAIN:-604800000}
      KAFKA_RETENTION_MS_DLQ: ${KAFKA_RETENTION_MS_DLQ:-2419200000}
      KAFKA_ENABLE_AUTO_COMMIT: ${KAFKA_ENABLE_AUTO_COMMIT:-false}
      KAFKA_AUTO_OFFSET_RESET: ${KAFKA_AUTO_OFFSET_RESET:-earliest}
      KAFKA_ACKS: ${KAFKA_ACKS:-all}
      KAFKA_RETRIES: ${KAFKA_RETRIES:-3}
      KAFKA_LINGER_MS: ${KAFKA_LINGER_MS:-10}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  inventory:
    build: ./inventory
    image: synapseshop-inventory:dev
    container_name: synapseshop-inventory
    ports:
      - "8001:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: synapseshop
      POSTGRES_USER: synapseshop
      POSTGRES_PASSWORD: synapseshop
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: synapseshop-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: synapseshop
      POSTGRES_USER: synapseshop
      POSTGRES_PASSWORD: synapseshop
    # o healthcheck permite que a API só suba depois do banco aceitar conexões,
    # em vez de depender de uma corrida de startup (ver `depends_on` acima)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapseshop -d synapseshop"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # Aula 8 - cache distribuído do catálogo. Tudo que está aqui é descartável:
  # cada chave pode ser reconstruída a partir do PostgreSQL. O volume nomeado
  # existe só para o cache não evaporar a cada `docker compose down` e obrigar
  # o benchmark a medir somente cache frio.
  redis:
    image: redis:7-alpine
    container_name: synapseshop-cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  redis_data:
  rabbitmq_data:
  kafka_data: