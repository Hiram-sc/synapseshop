services:

  api:
    build: .
    image: synapseshop:dev
    container_name: synapseshop-api
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: synapseshop
      POSTGRES_USER: synapseshop
      POSTGRES_PASSWORD: synapseshop
      # Aula 7 - assinatura e expiração do JWT, e limites de requisição.
      # Os valores abaixo são apenas para desenvolvimento; em produção a
      # chave sai do secret manager, nunca de um arquivo versionado.
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-dev-only-jwt-key-troque-em-producao}
      JWT_ACCESS_TOKEN_LIFETIME_MINUTES: ${JWT_ACCESS_TOKEN_LIFETIME_MINUTES:-30}
      THROTTLE_ANON_RATE: ${THROTTLE_ANON_RATE:-60/min}
      THROTTLE_USER_RATE: ${THROTTLE_USER_RATE:-300/min}
      THROTTLE_LOGIN_RATE: ${THROTTLE_LOGIN_RATE:-5/min}
      THROTTLE_ADMIN_WRITE_RATE: ${THROTTLE_ADMIN_WRITE_RATE:-30/min}
      # Aula 8 - cache-aside com Redis. O host é o nome do serviço na rede do
      # Compose. O cache nunca é obrigatório para a API responder: se o Redis
      # cair, a API continua servindo do PostgreSQL (fail-open).
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: ${REDIS_DB:-0}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_TTL_LISTA: ${CACHE_TTL_LISTA:-60}
      CACHE_TTL_DETALHE: ${CACHE_TTL_DETALHE:-300}
      # Aula 9 - broker da mensageria. A API é o produtor (publica depois do
      # commit); o worker consome. As credenciais abaixo são as de
      # desenvolvimento, as mesmas do serviço rabbitmq.
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER:-synapseshop}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-synapseshop}
      PEDIDO_IDEMPOTENCIA_TTL_S: ${PEDIDO_IDEMPOTENCIA_TTL_S:-3600}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # Aula 9 - broker RabbitMQ. Management na 15672 para inspeção de filas e
  # DLQ; o healthcheck atrasa o boot da API e do worker até o AMQP aceitar
  # conexões, em vez de deixar cada um tentando reconectar.
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: synapseshop-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-synapseshop}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-synapseshop}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # Aula 9 - consumidor do evento PedidoCriado. Mesma imagem da API, outro
  # command: o worker precisa do Django/ORM para idempotência e estado do
  # pedido, mas não serve HTTP.
  pedido-worker:
    build: .
    image: synapseshop:dev
    container_name: synapseshop-pedido-worker
    command: python manage.py pedido_worker
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: synapseshop
      POSTGRES_USER: synapseshop
      POSTGRES_PASSWORD: synapseshop
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: ${REDIS_DB:-0}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER:-synapseshop}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-synapseshop}
      PEDIDO_IDEMPOTENCIA_TTL_S: ${PEDIDO_IDEMPOTENCIA_TTL_S:-3600}
      PEDIDO_WORKER_MAX_TENTATIVAS: ${PEDIDO_WORKER_MAX_TENTATIVAS:-4}
      PEDIDO_WORKER_BACKOFF_BASE_S: ${PEDIDO_WORKER_BACKOFF_BASE_S:-0.25}
      # Falha proposital para validação da DLQ (fnmatch, separado por
      # vírgula). VAZIO por padrão: a falha forçada nunca fica ligada.
      PEDIDO_WORKER_FALHA_IDEM_KEYS: ${PEDIDO_WORKER_FALHA_IDEM_KEYS:-}
      PEDIDO_WORKER_ESPERA_RECONEXAO_S: ${PEDIDO_WORKER_ESPERA_RECONEXAO_S:-5}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  inventory:
    build: ./inventory
    image: synapseshop-inventory:dev
    container_name: synapseshop-inventory
    ports:
      - "8001:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: synapseshop
      POSTGRES_USER: synapseshop
      POSTGRES_PASSWORD: synapseshop
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: synapseshop-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: synapseshop
      POSTGRES_USER: synapseshop
      POSTGRES_PASSWORD: synapseshop
    # o healthcheck permite que a API só suba depois do banco aceitar conexões,
    # em vez de depender de uma corrida de startup (ver `depends_on` acima)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapseshop -d synapseshop"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # Aula 8 - cache distribuído do catálogo. Tudo que está aqui é descartável:
  # cada chave pode ser reconstruída a partir do PostgreSQL. O volume nomeado
  # existe só para o cache não evaporar a cada `docker compose down` e obrigar
  # o benchmark a medir somente cache frio.
  redis:
    image: redis:7-alpine
    container_name: synapseshop-cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  redis_data:
  rabbitmq_data: