services:

  api:
    build: .
    image: synapseshop:dev
    container_name: synapseshop-api
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: synapseshop
      POSTGRES_USER: synapseshop
      POSTGRES_PASSWORD: synapseshop
      # Aula 7 - assinatura e expiracao do JWT.
      # Os valores abaixo são apenas para desenvolvimento; em produção a
      # chave sai do secret manager, nunca de um arquivo versionado.
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-dev-only-jwt-key-troque-em-producao}
      JWT_ACCESS_TOKEN_LIFETIME_MINUTES: ${JWT_ACCESS_TOKEN_LIFETIME_MINUTES:-30}
    restart: unless-stopped

  inventory:
    build: ./inventory
    image: synapseshop-inventory:dev
    container_name: synapseshop-inventory
    ports:
      - "8001:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: synapseshop
      POSTGRES_USER: synapseshop
      POSTGRES_PASSWORD: synapseshop
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: synapseshop-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: synapseshop
      POSTGRES_USER: synapseshop
      POSTGRES_PASSWORD: synapseshop
    restart: unless-stopped